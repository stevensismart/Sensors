name: Refresh and deploy Helium NJ map

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '21 9 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: helium-map-pages
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install Python
        if: github.event_name != 'push'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        if: github.event_name != 'push'
        run: python -m pip install -r requirements.txt
      - name: Check required static datasets and municipality coverage
        run: |
          python - <<'PYTEST'
          import json
          from pathlib import Path
          assert Path('index.html').stat().st_size > 0
          boundary=json.loads(Path('data/municipalities.geojson').read_text())
          names={f['properties']['name'] for f in boundary['features']}
          assert len(names)==len(boundary['features'])
          assert len(names)>=22, f'Only {len(names)} municipality boundaries; regenerate datasets before merge'
          for fn in ('data/hexes.json','data/active_hexes.json'):
              data=json.loads(Path(fn).read_text())
              m=data.get('metadata',{})
              assert m.get('complete') is True, f'{fn} incomplete'
              actual=set(m.get('municipalities',[]))
              assert actual==names, f'{fn} municipality mismatch; missing={sorted(names-actual)}, extra={sorted(actual-names)}'
              assert data.get('cells'), f'{fn}: empty cells'
          print('PASS: full datasets cover all',len(names),'municipalities')
          PYTEST
      - name: Refresh reported gateway activity (daily/manual only)
        if: github.event_name != 'push'
        run: python fetch_active_hotspots.py --delay 0.4
      - name: Validate refreshed gateway activity
        if: github.event_name != 'push'
        run: |
          python - <<'PYTEST'
          import json
          d=json.load(open('data/active_hexes.json'))
          m=d['metadata']
          assert m.get('complete') is True and m.get('cells_queried',0)>0
          assert m.get('total_unique_active_gateways',0)>0
          print('Validated',m['cells_queried'],'H3 cells')
          PYTEST
      - name: Commit latest gateway snapshot
        if: github.event_name != 'push'
        run: |
          git add data/active_hexes.json
          if git diff --cached --quiet; then
            echo 'No gateway changes'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'data: refresh reported active Helium gateways'
            git push
          fi
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
