name: Refresh and deploy Helium NJ map

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '21 9 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: helium-map-pages
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Python
        if: github.event_name != 'push'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        if: github.event_name != 'push'
        run: pip install -r requirements.txt
      - name: Check required static datasets
        run: |
          test -s index.html
          test -s data/municipalities.geojson
          test -s data/hexes.json
          test -s data/active_hexes.json
      - name: Refresh gateway activity
        if: github.event_name != 'push'
        run: python fetch_active_hotspots.py --delay 0.4
      - name: Validate refreshed dataset
        if: github.event_name != 'push'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/active_hexes.json')
          data = json.loads(p.read_text())
          m = data.get('metadata', {})
          assert m.get('complete') is True, 'Snapshot not complete'
          assert m.get('cells_queried', 0) > 0, 'No query cells'
          assert m.get('total_unique_active_gateways', 0) > 0, 'No active gateways'
          assert isinstance(data.get('cells'), list) and data['cells'], 'No rows'
          print('Validated', m['cells_queried'], 'queried cells')
          PY
      - name: Commit refreshed snapshot
        if: github.event_name != 'push'
        run: |
          git add data/active_hexes.json
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'data: refresh reported active Helium gateways'
            git push
          fi
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
